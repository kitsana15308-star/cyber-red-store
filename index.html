<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberRed | ศูนย์กลางซื้อขายไอดีเกมและเติมเกม</title>
    
    <link rel="icon" type="image/png" href="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=128">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Firebase SDK (Modular v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, addDoc, getDocs, updateDoc, deleteDoc, onSnapshot, query, where, runTransaction } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyBtFjW_LG0kDtQw7btUV2mZAQfE_250Nt0",
          authDomain: "game-id-shop-37780.firebaseapp.com",
          projectId: "game-id-shop-37780",
          storageBucket: "game-id-shop-37780.firebasestorage.app",
          messagingSenderId: "761665418354",
          appId: "1:761665418354:web:195f08e9b506cc50147eeb"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        setPersistence(auth, browserLocalPersistence).catch(() => {});
        const db = getFirestore(app);

        const ADMIN_EMAILS = [
            "admin@cyberred.com",
            "admin@cyberred.store",
            "admin@shop.com",
            "anisvb@gmail.com"
        ];

        window.showToast = function(message) {
            const toast = document.getElementById('custom-toast');
            document.getElementById('toast-message').innerText = message;
            toast.classList.remove('hidden', 'toast-hide');
            toast.classList.add('toast-show');
            setTimeout(() => {
                toast.classList.remove('toast-show');
                toast.classList.add('toast-hide');
                setTimeout(() => toast.classList.add('hidden'), 300);
            }, 3000);
        };

        window.switchTab = function(tabId) {
            const protectedTabs = ['topup-section', 'orders-section', 'admin-section', 'service-topup-section', 'affiliate-section'];
            if(protectedTabs.includes(tabId) && !auth.currentUser) {
                showToast('กรุณาเข้าสู่ระบบก่อนใช้งานระบบนี้');
                tabId = 'login-section';
            }

            document.querySelectorAll('.app-section').forEach(sec => {
                sec.classList.remove('active-section');
                sec.classList.add('hidden');
            });
            const target = document.getElementById(tabId);
            if(target) {
                target.classList.remove('hidden');
                setTimeout(() => target.classList.add('active-section'), 10);
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
            closeSideMenu();

            if(tabId === 'market-section') loadMarketCategories();
            if(tabId === 'service-topup-section') loadServicePackagesCustomer();
            if(tabId === 'orders-section') { loadUserOrders(); loadUserTopupServices(); loadUserLedger(); }
            if(tabId === 'affiliate-section') { loadAffiliateData(); }
            if(tabId === 'admin-section') { loadAdminSettings(); loadProducts(); loadServicePackagesAdmin(); loadServiceRequestsAdmin(); }
        };

        window.openCustomModal = function(title, desc, confirmCallback, isTwoButton = true) {
            document.getElementById('modal-custom-title').innerText = title;
            document.getElementById('modal-custom-desc').innerHTML = desc;
            const btnContainer = document.getElementById('modal-custom-actions');
            
            if(isTwoButton) {
                btnContainer.innerHTML = `
                    <button onclick="closeCustomModal()" class="flex-1 bg-white/10 hover:bg-white/20 text-zinc-300 font-medium py-2.5 rounded-xl text-xs transition active:scale-95">ยกเลิก</button>
                    <button id="modal-confirm-btn" class="flex-1 bg-red-600 hover:bg-red-700 text-white font-medium py-2.5 rounded-xl text-xs transition shadow-lg active:scale-95">ยืนยัน</button>
                `;
                document.getElementById('modal-confirm-btn').onclick = () => {
                    closeCustomModal();
                    if(confirmCallback) confirmCallback();
                };
            } else {
                btnContainer.innerHTML = `
                    <button onclick="closeCustomModal()" class="w-full bg-white/10 hover:bg-white/20 text-white font-medium py-2.5 rounded-xl text-xs transition active:scale-95">ปิดหน้าต่าง</button>
                `;
            }
            document.getElementById('custom-modal-backdrop').classList.remove('hidden');
        };

        window.closeCustomModal = function() {
            document.getElementById('custom-modal-backdrop').classList.add('hidden');
        };

        window.openSideMenu = function() {
            document.getElementById('sideMenuOverlay').classList.remove('hidden');
            const menu = document.getElementById('sideMenu');
            menu.classList.remove('-translate-x-full');
            menu.classList.add('translate-x-0');
        };
        window.closeSideMenu = function() {
            document.getElementById('sideMenuOverlay').classList.add('hidden');
            const menu = document.getElementById('sideMenu');
            menu.classList.remove('translate-x-0');
            menu.classList.add('-translate-x-full');
        };

        window.handleUserNavClick = function() {
            if(auth.currentUser) openSideMenu();
            else switchTab('login-section');
        };

        window.authFormMode = 'login';
        window.setAuthMode = function(mode) {
            window.authFormMode = mode;
            const title = document.getElementById('page-auth-title');
            const btn = document.getElementById('page-auth-btn');
            const switchBtn = document.getElementById('page-auth-switch-text');
            const confirmPassDiv = document.getElementById('confirm-pass-container');
            const errBox = document.getElementById('page-auth-error');
            if(errBox) errBox.innerText = '';

            if(mode === 'login') {
                title.innerText = 'เข้าสู่ระบบ';
                btn.innerText = 'เข้าสู่ระบบ';
                confirmPassDiv.classList.add('hidden');
                switchBtn.innerHTML = 'ยังไม่มีบัญชีใช่หรือไม่? <span onclick="setAuthMode(\'register\')" class="text-red-400 font-medium underline cursor-pointer">สมัครสมาชิก</span>';
            } else {
                title.innerText = 'สมัครสมาชิก';
                btn.innerText = 'สมัครสมาชิก';
                confirmPassDiv.classList.remove('hidden');
                switchBtn.innerHTML = 'มีบัญชีอยู่แล้ว? <span onclick="setAuthMode(\'login\')" class="text-red-400 font-medium underline cursor-pointer">เข้าสู่ระบบ</span>';
            }
        };

        window.processAuth = async function() {
            const email = document.getElementById('page-auth-email').value.trim();
            const pass = document.getElementById('page-auth-pass').value.trim();
            const passConfirm = document.getElementById('page-auth-pass-confirm').value.trim();
            const errorBox = document.getElementById('page-auth-error');
            errorBox.innerText = '';

            if(!email || !pass) { errorBox.innerText = 'กรุณากรอกอีเมลและรหัสผ่าน'; return; }

            try {
                if(window.authFormMode === 'login') {
                    await signInWithEmailAndPassword(auth, email, pass);
                    showToast('เข้าสู่ระบบสำเร็จ');
                    switchTab('home-section');
                } else {
                    if(pass !== passConfirm) { errorBox.innerText = 'รหัสผ่านไม่ตรงกัน'; return; }
                    const isAdmin = ADMIN_EMAILS.includes(email);
                    const cred = await createUserWithEmailAndPassword(auth, email, pass);
                    await setDoc(doc(db, "users", cred.user.uid), {
                        email: email, balance: 0.00, role: isAdmin ? 'admin' : 'user',
                        refCode: Math.random().toString(36).substring(2, 8).toUpperCase(),
                        createdAt: new Date().toISOString()
                    });
                    showToast('สมัครสมาชิกสำเร็จ');
                    switchTab('home-section');
                }
            } catch(err) { errorBox.innerText = 'เกิดข้อผิดพลาด: ' + err.message; }
        };

        window.logout = async function() {
            await signOut(auth);
            showToast('ออกจากระบบเรียบร้อย');
            switchTab('home-section');
        };

        onAuthStateChanged(auth, async (user) => {
            const sideEmail = document.getElementById('side-user-email');
            const sideBalance = document.getElementById('side-user-balance');
            const sideRoleBadge = document.getElementById('side-role-badge');
            const adminSection = document.getElementById('admin-section');
            const adminSideBtn = document.getElementById('side-admin-btn');
            const topNavBtn = document.getElementById('top-auth-btn');
            const bottomNavLabel = document.getElementById('bottom-nav-auth-label');
            const protectedNavItems = document.querySelectorAll('.requires-auth');

            if(user) {
                protectedNavItems.forEach(el => el.classList.remove('hidden'));
                const isMatchAdminEmail = ADMIN_EMAILS.includes(user.email);
                let isAdmin = isMatchAdminEmail;

                const userRef = doc(db, "users", user.uid);
                try {
                    let snap = await getDoc(userRef);
                    if(snap.exists() && snap.data().role === 'admin') isAdmin = true;
                    if(isMatchAdminEmail && (!snap.exists() || snap.data().role !== 'admin')) {
                        await setDoc(userRef, { email: user.email, role: 'admin', refCode: Math.random().toString(36).substring(2, 8).toUpperCase() }, { merge: true });
                        isAdmin = true;
                    }
                } catch(err) {}

                if(sideEmail) sideEmail.innerText = user.email;
                if(sideRoleBadge) {
                    sideRoleBadge.className = isAdmin ? "text-[10px] bg-red-500/20 text-red-300 px-2.5 py-0.5 rounded border border-red-500/30 font-medium inline-block mt-1" : "text-[10px] bg-white/10 text-zinc-300 px-2.5 py-0.5 rounded font-medium inline-block mt-1";
                    sideRoleBadge.innerText = isAdmin ? "ผู้ดูแลระบบ" : "สมาชิก";
                }
                if(topNavBtn) {
                    topNavBtn.innerHTML = `<div class="flex items-center space-x-2"><span class="w-2 h-2 rounded-full ${isAdmin ? 'bg-red-500 animate-pulse' : 'bg-white'}"></span><span class="truncate max-w-[100px]">${user.email.split('@')[0]}</span></div>`;
                    topNavBtn.onclick = openSideMenu;
                }
                if(bottomNavLabel) bottomNavLabel.innerText = "บัญชี";

                if(isAdmin) {
                    if(adminSection) adminSection.classList.remove('hidden');
                    if(adminSideBtn) adminSideBtn.classList.remove('hidden');
                } else {
                    if(adminSection) adminSection.classList.add('hidden');
                    if(adminSideBtn) adminSideBtn.classList.add('hidden');
                }

                onSnapshot(userRef, (docSnap) => {
                    if(docSnap.exists()) {
                        const balance = docSnap.data().balance || 0;
                        if(sideBalance) sideBalance.innerText = `฿ ${balance.toFixed(2)}`;
                    }
                });
            } else {
                protectedNavItems.forEach(el => el.classList.add('hidden'));
                if(sideEmail) sideEmail.innerText = "ผู้เยี่ยมชม";
                if(sideBalance) sideBalance.innerText = "฿ 0.00";
                if(topNavBtn) { topNavBtn.innerHTML = `<span>เข้าสู่ระบบ</span>`; topNavBtn.onclick = () => switchTab('login-section'); }
                if(adminSection) adminSection.classList.add('hidden');
                if(adminSideBtn) adminSideBtn.classList.add('hidden');
            }
            loadMarketCategories();
            loadServicePackagesCustomer();
        });

        // ฟังก์ชันบีบอัดรูปภาพขั้นสูง ป้องกันไฟล์เกิน 1MB 
        function compressImage(file, maxWidth = 400, maxHeight = 400, quality = 0.4) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        if (width > height) {
                            if (width > maxWidth) { height *= maxWidth / width; width = maxWidth; }
                        } else {
                            if (height > maxHeight) { width *= maxHeight / height; height = maxHeight; }
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                };
                reader.readAsDataURL(file);
            });
        }

        window.handleServicePkgImageUpload = async function(event) {
            const file = event.target.files[0];
            if(!file) return;
            const compressed = await compressImage(file, 300, 300, 0.4);
            document.getElementById('admin-pkg-preview').src = compressed;
            document.getElementById('admin-pkg-base64').value = compressed;
            showToast('บีบอัดรูปภาพสำเร็จ พร้อมบันทึก');
        };

        window.addServicePackage = async function() {
            const name = document.getElementById('admin-pkg-name').value.trim();
            const price = parseFloat(document.getElementById('admin-pkg-price').value);
            const image = document.getElementById('admin-pkg-base64').value;

            if(!name || isNaN(price)) return showToast('กรุณากรอกชื่อและราคาแพ็กเกจให้ถูกต้อง');

            try {
                await addDoc(collection(db, "service_packages"), {
                    name, price, image: image || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=600', createdAt: new Date().toISOString()
                });
                showToast('เพิ่มแพ็กเกจสำเร็จเรียบร้อย');
                document.getElementById('admin-pkg-name').value = '';
                document.getElementById('admin-pkg-price').value = '';
                document.getElementById('admin-pkg-base64').value = '';
                document.getElementById('admin-pkg-preview').src = 'https://via.placeholder.com/80?text=Pkg';
                loadServicePackagesAdmin();
            } catch(e) {
                showToast('เกิดข้อผิดพลาด: ' + e.message);
            }
        };

        async function loadServicePackagesAdmin() {
            const container = document.getElementById('admin-service-packages-list');
            if(!container) return;
            container.innerHTML = '';
            try {
                const querySnapshot = await getDocs(collection(db, "service_packages"));
                querySnapshot.forEach((docSnap) => {
                    const p = docSnap.data();
                    container.innerHTML += `
                        <div class="flex justify-between items-center bg-white/5 p-3 rounded-2xl border border-white/10 text-xs transition hover:bg-white/10">
                            <div class="flex items-center space-x-3">
                                ${p.image ? `<img src="${p.image}" class="w-9 h-9 rounded-xl object-cover">` : ''}
                                <div><p class="text-white font-medium">${p.name}</p><span class="text-red-400 font-semibold">฿${p.price}</span></div>
                            </div>
                            <button onclick="deleteServicePackage('${docSnap.id}')" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded-xl text-xs font-medium transition shadow active:scale-95">ลบ</button>
                        </div>
                    `;
                });
                if(!container.innerHTML) container.innerHTML = '<p class="text-zinc-400 text-xs text-center">ยังไม่มีแพ็กเกจ</p>';
            } catch(e) {}
        }

        window.deleteServicePackage = async function(pkgId) {
            openCustomModal('ยืนยันการลบ', 'คุณต้องการลบแพ็กเกจนี้ใช่หรือไม่', async () => {
                await deleteDoc(doc(db, "service_packages", pkgId));
                showToast('ลบแพ็กเกจสำเร็จ');
                loadServicePackagesAdmin();
            });
        };

        window.loadMarketCategories = async function() {
            const container = document.getElementById('market-categories-container');
            if(!container) return;
            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                container.innerHTML = '';
                let categoriesMap = {};
                querySnapshot.forEach((docSnap) => {
                    const p = docSnap.data();
                    const catName = p.categoryName || p.category || 'สินค้าทั่วไป';
                    const catImage = p.categoryImage || p.image || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=600';
                    if(!categoriesMap[catName]) categoriesMap[catName] = { name: catName, image: catImage, count: 0 };
                    categoriesMap[catName].count++;
                });
                const categories = Object.values(categoriesMap);
                if(categories.length === 0) { container.innerHTML = '<p class="text-zinc-300 text-xs col-span-full text-center py-6">ยังไม่มีหมวดหมู่สินค้า</p>'; return; }
                categories.forEach(cat => {
                    container.innerHTML += `
                        <div class="glass-panel rounded-3xl overflow-hidden relative group flex flex-col justify-between p-4 shadow-xl">
                            <div class="h-40 bg-black/40 rounded-2xl overflow-hidden mb-3 relative">
                                <img src="${cat.image}" class="w-full h-full object-cover">
                                <div class="absolute top-3 right-3 bg-black/60 px-3 py-1 rounded-xl text-xs text-white">${cat.count} รายการ</div>
                            </div>
                            <h4 class="font-semibold text-base text-white mb-3 truncate">${cat.name}</h4>
                            <button onclick="openCategoryProducts('${cat.name}')" class="w-full bg-red-600 hover:bg-red-700 text-white text-xs py-3 rounded-xl font-medium transition active:scale-95">ดูสินค้าทั้งหมด</button>
                        </div>
                    `;
                });
            } catch(e) {}
        };

        window.loadServicePackagesCustomer = async function() {
            const selectEl = document.getElementById('service-item-select');
            if(!selectEl) return;
            try {
                const querySnapshot = await getDocs(collection(db, "service_packages"));
                selectEl.innerHTML = '';
                let count = 0;
                querySnapshot.forEach((docSnap) => {
                    const pkg = docSnap.data();
                    count++;
                    selectEl.innerHTML += `<option value="${pkg.name} (ราคา ${pkg.price} บาท)">${pkg.name} - ราคา ${pkg.price} บาท</option>`;
                });
                if(count === 0) selectEl.innerHTML = '<option value="Robux 400 (ราคา 150 บาท)">Robux 400 - ราคา 150 บาท</option>';
            } catch(e) {
                selectEl.innerHTML = '<option value="Robux 400 (ราคา 150 บาท)">Robux 400 - ราคา 150 บาท</option>';
            }
        };

        window.toggleSupportMenu = function() {
            const menu = document.getElementById('support-options-menu');
            if(menu) menu.classList.toggle('hidden');
        };
    </script>

    <style>
        body { 
            font-family: 'Prompt', sans-serif; 
            background: linear-gradient(135deg, #090a0f 0%, #1a0507 50%, #090a0f 100%);
            color: #f4f4f5; padding-bottom: 95px; min-height: 100vh;
        }
        .app-section { opacity: 0; transform: translateY(10px); transition: opacity 0.3s ease, transform 0.3s ease; }
        .app-section.active-section { opacity: 1; transform: translateY(0); }
        @keyframes toastIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        .toast-show { animation: toastIn 0.3s forwards; }
        .toast-hide { opacity: 0; transition: opacity 0.3s; }
        .glass-panel { background: rgba(18, 19, 26, 0.65); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.12); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- Toast -->
    <div id="custom-toast" class="fixed top-5 right-5 z-50 hidden">
        <div class="glass-panel border-red-500/40 text-white px-5 py-3 rounded-2xl shadow-2xl flex items-center space-x-3">

            <p id="modal-custom-desc" class="text-xs text-zinc-300"></p>
            <div id="modal-custom-actions" class="flex space-x-2 pt-2"></div>

    </div>

    <header class="glass-panel sticky top-0 z-40 border-b border-white/10 px-4 py-3.5 flex justify-between items-center">
        <span class="text-xl font-bold text-white tracking-tight">Cyber<span class="text-red-500">Red</span></span>
        <div class="flex items-center space-x-3">
            <button id="top-auth-btn" onclick="switchTab('login-section')" class="bg-white/10 text-white text-xs px-4 py-2 rounded-xl">เข้าสู่ระบบ</button>
            <button onclick="openSideMenu()" class="text-zinc-200 p-1.5"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
        </div>
    </header>

    <!-- Side Menu -->
    <div id="sideMenuOverlay" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden" onclick="closeSideMenu()"></div>
    <div id="sideMenu" class="fixed top-0 left-0 w-80 h-full glass-panel border-r border-white/10 z-50 transform -translate-x-full transition-transform duration-300 p-6 flex flex-col justify-between">
        <div>
            <div class="flex justify-between items-center pb-4 border-b border-white/10">
                <div>
                    <h4 id="side-user-email" class="text-xs font-medium text-white">ผู้เยี่ยมชม</h4>
                    <span id="side-role-badge" class="text-[10px] bg-white/10 text-zinc-300 px-2 py-0.5 rounded mt-1 inline-block">ทั่วไป</span>
                </div>
                <button onclick="closeSideMenu()" class="text-zinc-400 text-2xl">&times;</button>
            </div>
            <div class="bg-white/5 p-4 rounded-2xl my-4">
                <p class="text-[11px] text-zinc-400">เครดิตคงเหลือ</p>
                <h3 id="side-user-balance" class="text-2xl font-bold text-red-400">฿ 0.00</h3>
            </div>
            <div class="space-y-2 text-xs font-medium">
                <button onclick="switchTab('market-section')" class="w-full text-left py-2.5 px-3 rounded-xl hover:bg-white/10 text-zinc-200">หน้าซื้อสินค้า</button>
                <button onclick="switchTab('service-topup-section')" class="w-full text-left py-2.5 px-3 rounded-xl hover:bg-white/10 text-zinc-200">หน้าเติม Robux / เกม</button>
                <button id="side-admin-btn" onclick="switchTab('admin-section')" class="w-full text-left py-2.5 px-3 rounded-xl hover:bg-white/10 text-red-400 hidden">แผงควบคุมระบบ</button>
            </div>
        </div>
        <button onclick="logout()" class="requires-auth hidden w-full bg-red-600/20 text-red-300 py-3 rounded-2xl text-xs">ออกจากระบบ</button>
    </div>

    <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full space-y-8">
        
        <!-- หน้า Login -->
        <section id="login-section" class="app-section hidden max-w-sm mx-auto">
            <div class="glass-panel p-8 rounded-3xl space-y-5 border border-white/20">
                <h2 id="page-auth-title" class="text-xl font-semibold text-white text-center">เข้าสู่ระบบ</h2>
                <div id="page-auth-switch-text" class="text-xs text-zinc-300 text-center">ยังไม่มีบัญชีใช่หรือไม่? <span onclick="setAuthMode('register')" class="text-red-400 underline cursor-pointer">สมัครสมาชิก</span></div>
                <div class="space-y-3.5">
                    <input type="email" id="page-auth-email" placeholder="อีเมล" class="w-full bg-black/50 border border-white/20 rounded-2xl p-3.5 text-xs text-white">
                    <input type="password" id="page-auth-pass" placeholder="รหัสผ่าน" class="w-full bg-black/50 border border-white/20 rounded-2xl p-3.5 text-xs text-white">
                    <div id="confirm-pass-container" class="hidden">
                        <input type="password" id="page-auth-pass-confirm" placeholder="ยืนยันรหัสผ่าน" class="w-full bg-black/50 border border-white/20 rounded-2xl p-3.5 text-xs text-white">
                    </div>
                    <button id="page-auth-btn" onclick="processAuth()" class="w-full bg-red-600 hover:bg-red-700 text-white py-3 rounded-2xl text-xs">เข้าสู่ระบบ</button>
                    <div id="page-auth-error" class="text-xs text-center text-red-400"></div>
                </div>
            </div>
        </section>

        <!-- หมวดหมู่สินค้า -->
        <section id="market-section" class="app-section active-section space-y-6">
            <div class="text-center">
                <h3 class="text-xl font-semibold text-white">หมวดหมู่สินค้า</h3>
            </div>
            <div id="market-categories-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-5"></div>
        </section>

        <!-- บริการเติมเกม -->
        <section id="service-topup-section" class="app-section hidden max-w-md mx-auto space-y-6">
            <div class="glass-panel p-7 rounded-3xl space-y-4">
                <h3 class="text-lg font-semibold text-white text-center">บริการเติมเกมและ Robux</h3>
                <div>
                    <label class="text-[10px] text-zinc-300">ข้อมูล ID-PASS</label>
                    <input type="text" id="service-game-id" placeholder="ID / Password" class="w-full bg-black/40 border border-white/20 rounded-2xl p-3 text-xs text-white mt-1">
                </div>
                <div>
                    <label class="text-[10px] text-zinc-300">เลือกแพ็กเกจ</label>
                    <select id="service-item-select" class="w-full bg-black/40 border border-white/20 rounded-2xl p-3 text-xs text-white mt-1"></select>
                </div>
            </div>
        </section>

        <!-- แผงควบคุมแอดมิน -->
        <section id="admin-section" class="app-section hidden space-y-6 glass-panel p-7 rounded-3xl">
            <div class="flex justify-between items-center border-b border-white/10 pb-4">
                <h3 class="text-base font-semibold text-red-400">แผงควบคุมผู้ดูแลระบบ</h3>
                <span class="text-[10px] bg-red-500/20 text-red-300 px-3 py-1 rounded-xl font-mono">ADMIN</span>
            </div>
            
            <div class="space-y-6">
                <!-- จัดการแพ็กเกจเติมเกม -->
                <div class="bg-white/5 p-5 rounded-2xl border border-white/10 space-y-4">
                    <h4 class="text-xs font-semibold text-white">จัดการแพ็กเกจเติมเกม</h4>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                        <input type="text" id="admin-pkg-name" placeholder="ชื่อแพ็กเกจ เช่น 4500 Robux" class="w-full bg-black/40 border border-white/15 p-3 rounded-xl text-xs text-white">
                        <input type="number" id="admin-pkg-price" placeholder="ราคา" class="w-full bg-black/40 border border-white/15 p-3 rounded-xl text-xs text-white">
                        <div class="flex items-center space-x-2">
                            <input type="file" accept="image/*" onchange="handleServicePkgImageUpload(event)" class="w-full bg-black/40 border border-white/15 p-2 rounded-xl text-xs text-zinc-300">
                        </div>
                    </div>
                    <input type="hidden" id="admin-pkg-base64">
                    <img id="admin-pkg-preview" src="https://via.placeholder.com/80?text=Pkg" class="w-16 h-16 rounded-xl object-cover border border-white/10">
                    <button onclick="addServicePackage()" class="w-full bg-red-600 hover:bg-red-700 text-white py-3 rounded-xl text-xs font-medium shadow active:scale-95">เพิ่มแพ็กเกจ</button>
                    <div id="admin-service-packages-list" class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2"></div>
                </div>
            </div>
        </section>
    </main>

    <!-- Bottom Navigation -->
    <div class="fixed bottom-0 left-0 right-0 glass-panel border-t border-white/10 py-3 px-6 z-40">
        <div class="max-w-md mx-auto flex justify-around items-center text-center text-[10px]">
            <button onclick="switchTab('market-section')" class="text-zinc-300 hover:text-white">หน้าแรก</button>
            <button onclick="switchTab('service-topup-section')" class="requires-auth hidden text-zinc-300 hover:text-white">เติมเกม</button>
            <button onclick="switchTab('login-section')" class="text-zinc-300 hover:text-white">บัญชี</button>
        </div>
    </div>
</body>
</html>
